EXIT=27

[SYSTEM]
;Default data folder is in "%userProfile%\AppData\LocalLow\AppData\LocalLow\clairstyler _ Klockworks\DCOP\"
;Set this to "1" to save data in "\NVRAM\" folder from game root path.
LOCAL_SAVE=1