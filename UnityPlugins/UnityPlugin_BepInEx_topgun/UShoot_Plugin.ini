[VIDEO]
FORCE_RESOLUTION=1
WIDTH=1920
HEIGHT=1080
FULLSCREEN=1
SCALE_TO_HORIZONTAL=1

[INPUT_KEYS]
;Set Keycode (decimal value) for each key. See following link for the value list: 
;https://gist.github.com/Extremelyd1/4bcd495e21453ed9e1dffa27f6ba5f69
;
;/!\ WARNING : This will only work when plugin is used in standalone mode for debug purpose /!\
;
P1_START=49
P1_COIN=53
TEST=48
MENU_UP=273
MENU_DOWN=274
MENU_SELECT=13
REFILL=8
EXIT=27

[SYSTEM]
;Default data folder is in "d:\\gametemp" and Log are in "c:\\GameLog"
;Set this to "1" to save data in "\NVRAM\" folder from game root path.
LOCAL_SAVE=1
